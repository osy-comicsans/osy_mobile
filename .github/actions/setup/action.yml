name: Set up project
description: Install pnpm, Node.js, and locked dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
